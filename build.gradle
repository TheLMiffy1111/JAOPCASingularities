plugins {
	id "com.crystaelix.loom" version "1.17-SNAPSHOT"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "com.crystaelix.blossom" version "1.3.2"
	id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.crystaelix.com/releases/"
			}
		}
		filter {
			includeGroup "thelm.jaopca"
			includeGroup "thelm.wrapup"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com/"
			}
		}
		filter {
			includeGroup "mezz.jei"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.covers1624.net/"
			}
		}
		filter {
			includeGroup "codechicken"
			includeGroup "morph.avaritia"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://repo.cleanroommc.com/releases/"
			}
		}
		filter {
			includeGroup "zone.rong"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://cursemaven.com/"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
}

def mcVersion = "1.12.2"
def modName = "JAOPCASingularities"
def modId = "jaopcasingularities"
def specVersion = "3"
def vendor = "thelm"

group = "thelm.jaopca.singularities"
version = "3.0.1.4"

def archivesName = "${modName}-${mcVersion}"
base.archivesName = archivesName

sourceSets {
	configureEach {
		output.resourcesDir = java.destinationDirectory = layout.buildDirectory.dir("outputs/${name}")
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(8)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	silentMojangMappingsLicense()
	runs {
		configureEach {
			property "fabric.log.console.level", "debug"
		}
		client {
			programArg "--username=Dev"
			vmArg "-Xmx7G"
		}
		server {
			vmArg "-Xmx3G"
		}
	}
	generatedIntermediateMappings()
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:1.12.2"
	mappings "de.oceanlabs.mcp:mcp_stable:39-1.12"
	legacyForge "net.minecraftforge:forge:1.12.2-14.23.5.2864"

	// Dependencies
	implementation "thelm.wrapup:WrapUp-1.12.2:1.1.3"
	modImplementation "thelm.jaopca:JAOPCA-1.12.2:2.3.14.38"
	modImplementation "codechicken:CodeChickenLib:1.12.2-3.2.3.358:universal"
	modImplementation("morph.avaritia:Avaritia:1.12.2-3.3.0.37:universal") {transitive = false}
	modImplementation "curse.maven:wanionlib-253043:4623135"
	modImplementation "curse.maven:eternal-singularity-253077:2922583"
	modImplementation "mezz.jei:jei_1.12.2:4.16.1.1013"

	// Testing
	modImplementation "curse.maven:abyssalcraft-53686:7253998"

	// Performance
	implementation("zone.rong:mixinbooter:10.7") {transitive = false}
	modImplementation "curse.maven:reid-629017:8029704"
	modImplementation "curse.maven:vintagefix-871198:7958801"
	modImplementation "curse.maven:chibi-460609:8225778"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesName
			artifact remapJar
			artifact sourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = remapJar.archiveFile
	version = displayName = "${mcVersion}-${project.version}"
	changelog = file("changelog.md").text
	type = BETA
	modLoaders.add("forge")
	additionalFiles.from(sourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "268610"
		minecraftVersions.add(mcVersion)
		client = true
		server = true
		requires "jaopca", "avaritia-1-10"
		optional "eternal-singularity"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "O9qb04PW"
		minecraftVersions.add(mcVersion)
		environment = CLIENT_AND_SERVER
		requires "jaopca"
	}
}
