plugins {
	id "com.crystaelix.loom" version "1.17-SNAPSHOT"
	id "ploceus" version "1.17-SNAPSHOT"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "com.crystaelix.blossom" version "1.3.2"
	id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.crystaelix.com/releases/"
			}
		}
		filter {
			includeGroup "thelm.jaopca"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://nexus.gtnewhorizons.com/repository/public/"
				metadataSources {
					mavenPom()
					ignoreGradleMetadataRedirection()
				}
			}
		}
		filter {
			includeGroup "com.github.GTNewHorizons"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://jitpack.io/"
			}
		}
		filter {
			includeGroup "com.github.LegacyModdingMC.UniMixins"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://cursemaven.com/"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
}

def mcVersion = "1.7.10"
def modName = "JAOPCASingularities"
def modId = "jaopcasingularities"
def specVersion = "W"
def vendor = "thelm"

group = "thelm.jaopca.singularities"
version = "W.0.1.5"

def archivesName = "${modName}-${mcVersion}"
base.archivesName = archivesName

sourceSets {
	configureEach {
		output.resourcesDir = java.destinationDirectory = layout.buildDirectory.dir("outputs/${name}")
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(8)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	silentMojangMappingsLicense()
	runs {
		configureEach {
			property "fabric.log.console.level", "debug"
		}
		client {
			programArg "--username=Dev"
			vmArg "-Xmx7G"
		}
		server {
			vmArg "-Xmx3G"
		}
	}
	generatedIntermediateMappings()
}

ploceus {
	disableLibraryUpgrades()
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:1.7.10"
	mappings loom.layered {
		mcp "de.oceanlabs.mcp:mcp_stable:12-1.7.10"
		mcp "net.minecraftforge:forge:1.7.10-10.13.4.1614-1.7.10:userdev"
	}
	exceptions ploceus.raven("1")
	signatures ploceus.sparrow("1")
	nests ploceus.nests("2")
	legacyForge "net.minecraftforge:forge:1.7.10-10.13.4.1614-1.7.10:universal"

	// Dependencies
	implementation("com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:0.3.1") {transitive = false}
	modImplementation "thelm.jaopca:JAOPCA-1.7.10:W.0.8.31"
	modImplementation "curse.maven:avaritia-233785:2519595"
	modImplementation "curse.maven:wanionlib-253043:2430662"
	modImplementation "curse.maven:eternal-singularity-253077:2577977"
	modImplementation("com.github.GTNewHorizons:CodeChickenCore:1.4.16") {transitive = false}
	modImplementation("com.github.GTNewHorizons:NotEnoughItems:2.8.114-GTNH") {transitive = false}
	modImplementation "curse.maven:nei-integration-225251:2282522"

	// Testing
	modImplementation "curse.maven:hbms-nuclear-tech-mod-235439:8048097"

	// Performance
	modImplementation("com.github.GTNewHorizons:GTNHLib:0.11.44") {transitive = false}
	modImplementation("com.github.GTNewHorizons:NotEnoughIds:2.1.11") {transitive = false}
	modImplementation "curse.maven:archaicfix-677782:8125364"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesName
			artifact remapJar
			artifact sourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = remapJar.archiveFile
	version = displayName = "${mcVersion}-${project.version}"
	changelog = file("changelog.md").text
	type = ALPHA
	modLoaders.add("forge")
	additionalFiles.from(sourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "268610"
		minecraftVersions.add(mcVersion)
		client = true
		server = true
		requires "jaopca", "avaritia"
		optional "eternal-singularity"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "O9qb04PW"
		minecraftVersions.add(mcVersion)
		environment = CLIENT_AND_SERVER
		requires "jaopca"
	}
}
